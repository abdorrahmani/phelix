# Phelix project configuration for the docker-compose-rust example (split
# ownership: Phelix runs the app, docker-compose runs the backing services).
#
# deploy.runtime: docker  → Phelix builds an image and runs each instance as a
#                           container (one Phelix agent on the host manages many
#                           app containers as one server).
# deploy.strategy: blue-green → required: the docker runtime rides the
#                           zero-downtime topology; classic is native-only.
# deploy.network: <name>  → attach each app container to this EXISTING Docker
#                           network so the app resolves backing services (here
#                           redis:6379) by their docker-compose DNS names. The
#                           network is created by `docker compose up -d` (see
#                           docker-compose.yml); Phelix never creates it.
name: compose-rust-demo
port: 8080
watching: disable
deploy:
  runtime: docker
  strategy: blue-green
  network: phelix-compose-rust
health:
  endpoints:
    - name: default
      path: /health
      interval: 10s
      retries: 3
      mode: auto

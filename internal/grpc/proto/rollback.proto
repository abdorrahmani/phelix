syntax = "proto3";

package phelix;

option go_package = "github.com/abdorrahmani/phelix/internal/grpc/proto";

// RollbackLifecycleEvent reports a single step in the rollback execution
// lifecycle. The backend receives a stream of these events to reconstruct
// the full rollback timeline, display real-time progress, generate an audit
// trail, and diagnose failures.
message RollbackLifecycleEvent {
  // Identity
  string server_id = 1;
  string cli_app_id = 2;
  string resolved_app_id = 3;
  string app_name = 4;

  // Rollback configuration
  string deployment_mode = 5;
  string rollback_strategy = 6;

  // Versioning
  string current_version = 7;
  string target_version = 8;
  string target_tag = 9;

  // Execution state
  string current_step = 10;
  bool success = 11;
  string message = 12;
  string error = 13;

  // Timestamps and timing
  int64 timestamp = 14;
  int64 duration_ms = 15;

  // Process context
  int32 pid = 16;

  // Auth identity
  string user_id = 17;
  string session_token = 18;

  // Version list (populated on --list events)
  repeated RollbackVersionEntry versions = 19;

  // Arbitrary key-value metadata for future extensibility.
  map<string, string> metadata = 20;

  // ---- Additions below are additive and backward compatible: an older
  // backend sees unknown fields and ignores them (proto3 guarantee). ----

  // Structured phelix error code for failed terminal events ("failed",
  // "verify_failed", "verify_cancelled"), taken from internal/errors/codes.go
  // (e.g. ROLLBACK_FAILED, ROLLBACK_VERIFY_FAILED, ROLLBACK_TARGET_NOT_FOUND,
  // DEPLOY_LOCKED). Empty on success and on non-terminal steps. The free-form
  // `error` field carries the human-readable message; this field is the
  // machine-readable classification and must never be inferred from `error`.
  string error_code = 21;

  // Operator-supplied rollback reason, already validated by the CLI: trimmed,
  // internal whitespace collapsed, at most 500 characters. Empty = no reason
  // was supplied (absent and explicitly-empty are both "no reason" by the
  // time they reach the wire — the CLI rejects an explicit empty reason).
  // Canonical representation; supersedes the legacy metadata key
  // "rollback_reason".
  string reason = 22;

  // Post-rollback stability verification (--verify). verify_requested=false
  // means verification was not requested; fields 24-26 are then unused and
  // must be treated as unset regardless of their wire values.
  bool verify_requested = 23;
  // Requested observation window in milliseconds (e.g. 30s → 30000). The
  // window is the whole observation period, not one probe.
  int64 verify_duration_ms = 24;
  // Outcome, set once verification concludes: "passed" | "failed" |
  // "cancelled". Empty while the rollback is still executing. A rollback is
  // fully successful only when success=true AND verify_status is empty or
  // "passed" — ROLLBACK_VERIFY_FAILED is reported via error_code on the
  // terminal verification event, never via success=false on `complete`.
  string verify_status = 25;
  // Failure/cancellation detail; empty when passed or not requested.
  string verify_error = 26;

  // How the rollback target was chosen: "explicit" (--to flag),
  // "interactive" (picker selection), or "previous" (no target given — the
  // CLI resolved current-1). Empty on non-execution events (list, preview,
  // history). The backend must not infer this from target_version.
  string target_source = 27;

  // True for dry-run preview events. A preview event is a read-only report:
  // the CLI emits it from the dry-run path, which never mutates process,
  // proxy, deployment, version, symlink or audit state.
  bool dry_run = 28;

  // Structured rollback preview, set only when dry_run=true. Mirrors the
  // CLI's RollbackPlan (internal/deploy/rollback_plan.go) minus local
  // filesystem paths, which the backend has no use for.
  RollbackPreview preview = 29;

  // Structured rollback history records, set only on "history" events. Each
  // entry mirrors one line of the per-app rollback_history.jsonl; the mode is
  // the strategy actually used for that rollback, not the app's current mode.
  repeated RollbackHistoryEntry history = 30;

  // Rollback origin: "manual" (operator-invoked) or "automatic"
  // (post-failed-deploy recovery). Empty means "manual" (written by agents
  // before this field existed). The backend must persist this so history can
  // distinguish operator rollbacks from recoveries.
  string source = 31;

  // Backend command correlation id. Typed field for new consumers; metadata
  // key "request_id" remains a compatibility fallback for older integrations.
  string request_id = 32;
}

// RollbackPreview is the structured dry-run output. All fields are read-only
// observations of the app's current deployment state.
message RollbackPreview {
  string app_name = 1;
  int32 current_version = 2;   // 0 when unknown
  string current_tag = 3;      // empty = no tag
  string current_commit = 4;
  int64 current_size = 5;      // bytes; 0 when unknown
  int32 target_version = 6;
  string target_tag = 7;
  string target_commit = 8;
  int64 target_built_at = 9;   // unix millis; 0 = unknown
  int64 target_size = 10;      // bytes
  // "classic" | "blue-green" | "rolling" — the strategy the rollback would use.
  string strategy = 11;
  int32 replicas = 12;         // rolling only
  int32 public_port = 13;      // proxy public port; 0 = n/a
  string current_slot = 14;    // blue-green only; empty = n/a
  string target_slot = 15;     // blue-green only
  int32 current_port = 16;     // current instance internal port; 0 = n/a
  string health_check = 17;    // human-readable tier summary
  bool downtime = 18;          // true for classic stop→start
  bool env_snapshot_available = 19;
  string env_summary = 20;
  // Ordered plan steps the CLI would execute, and warnings about the plan.
  repeated string steps = 21;
  repeated string warnings = 22;
}

// RollbackHistoryEntry mirrors one record of the agent's structured rollback
// history (rollback_history.jsonl). Timestamps are unix millis.
message RollbackHistoryEntry {
  int64 time = 1;
  string from_version = 2;   // "vN" (the failed/deployed version automatic rollbacks recover from)
  string to_version = 3;     // "vN"
  string status = 4;         // "success" | "failed" — EXECUTION outcome only
  string mode = 5;           // "classic" | "blue-green" | "rolling" — what actually happened
  string reason = 6;         // validated operator reason; empty = none
  string source = 7;         // "manual" | "automatic"
  string error = 8;          // execution failure detail; empty on success
  // Verification sub-record, matching the semantics of fields 23-26 above:
  // empty verify_status = not requested; "passed" | "failed" | "cancelled".
  string verify_status = 9;
  string verify_duration = 10; // Go duration string, e.g. "30s", "2m30s"
  string verify_error = 11;
}

// RollbackVersionEntry describes one retained version in the --list output.
message RollbackVersionEntry {
  int32 version = 1;
  string tag = 2;
  string git_commit = 3;
  int64 build_timestamp = 4;
  int64 binary_size = 5;
  bool current = 6;
  bool prune_soon = 7;
}

syntax = "proto3";

package phelix;

option go_package = "github.com/abdorrahmani/phelix/internal/grpc/proto";

import "internal/grpc/proto/ping.proto";
import "internal/grpc/proto/deployment.proto";

// ============================================================================
// Monitoring data messages
//
// These messages mirror the data that was previously transmitted through the
// WebSocket monitor (internal/monitor). Field names and semantics match the
// original JSON payloads 1:1 so the backend can preserve existing behavior
// while switching transport.
// ============================================================================

// ServerInfo mirrors server.Info. Sent once when the monitor stream is
// (re)established, exactly like the old "servers" WebSocket message. id is
// the persistent Phelix agent_id; it is not a host machine ID.
message ServerInfo {
  string id = 1;
  string hostname = 2;
  string ip_v4 = 3;
  string ip_v6 = 4;
  string os_type = 5;
  string os_full = 6;
  string cpu_info = 7;
  repeated string network_ifaces = 8;
  int64 total_memory = 9;
  int32 total_cpu_cores = 10;
  int64 total_storage = 11;
  string uptime = 12;
  int64 last_reboot = 13;
  string status = 14;
  int64 created_at = 15;
  string region = 16;
  string architecture = 17;
  string kernel_version = 18;
  int64 swap_total = 19;

  // Server-settings groups (agent-reported DEFAULTS). The CLI auto-detects
  // the current host state and product defaults and reports them here.
  // A nil/absent group means the CLI has no configuration to report — the
  // same semantics as ApplicationInfo's config groups (fields 20-23 on that
  // message). These are DEFAULTS only; the backend owns real configuration
  // through its own API.
  ServerConnection connection = 20;
  ServerAlert alert = 21;
  ServerSecurity security = 22;

}

// ServerConnection mirrors the backend server's ServerConnection model: how
// the backend should reach this host over SSH. ssh_password and private_key
// are WRITE-ONLY — the agent sends them, but the backend must never echo
// them back to the CLI/UI or persist them anywhere they can be read back.
// public_key is READ-ONLY (agent-to-backend only).
message ServerConnection {
  int32 ssh_port = 1;       // listening sshd port; CLI default 22
  string ssh_user = 2;      // SSH user; CLI default "phelix"
  string auth_method = 3;   // "key" or "password"; CLI default "key"
  string ssh_password = 4;  // WRITE-ONLY, never serialized back
  string private_key = 5;   // WRITE-ONLY, never serialized back
  string public_key = 6;    // READ-ONLY
}

// ServerAlert mirrors the backend server's ServerAlert model: alert
// thresholds (percentages) and the toggles that enable each alert class.
// The CLI reports its defaults (80/90/90, toggles off); the backend owns
// the real values through its API. Thresholds are always populated with
// concrete values by the CLI — treat 0 as a real value, never as "unset".
message ServerAlert {
  double cpu_threshold = 1;  // percent; CLI default 80
  double ram_threshold = 2;  // percent; CLI default 90
  double disk_threshold = 3; // percent; CLI default 90
  bool cpu_spike_alerts = 4;
  bool memory_pressure_alerts = 5;
  bool disk_space_alerts = 6;
  bool app_crash_alerts = 7;
  bool agent_disconnect_alerts = 8;
  bool weekly_digest = 9;
}

// ServerSecurity mirrors the backend server's ServerSecurity model. ssh_root_login
// carries the sshd PermitRootLogin value verbatim (yes / prohibit-password / no).
message ServerSecurity {
  bool firewall_enabled = 1;
  bool auto_updates = 2;
  string ssh_root_login = 3;       // sshd PermitRootLogin; CLI default "prohibit-password"
  bool ip_allowlist_enabled = 4;   // CLI default false
  repeated string allowed_ips = 5; // empty list = none, not unset
  repeated int32 open_ports = 6;   // distinct listening TCP ports, sorted ascending
}

// ServerMetrics mirrors server.Metrics. Sent on every monitoring tick
// (~2s), exactly like the old "server_metrics" WebSocket message.
message ServerMetrics {
  string server_id = 1;
  uint64 used_memory = 2;
  uint64 free_memory = 3;
  double memory_percent = 4;
  double cpu_usage_percent = 5;
  uint64 used_storage = 6;
  uint64 free_storage = 7;
  double storage_percent = 8;
  int64 timestamp = 9;
  uint64 network_in = 10;
  uint64 network_out = 11;
  double load_avg_1min = 12;
  double load_avg_5min = 13;
  double load_avg_15min = 14;
  uint64 swap_used = 15;
  uint64 swap_free = 16;
  double swap_percent = 17;
  uint32 running_processes = 18;
}

// AppResourceMetrics mirrors monitor.AppMetrics (per-app CPU/RAM usage).
// Sent on every monitoring tick, exactly like the old "metrics" WebSocket
// message.
message AppResourceMetrics {
  string app_id = 1;
  string server_id = 2;
  double cpu_usage = 3;
  uint64 memory_usage = 4;
}

// ApplicationInfo mirrors monitor.AppDetails. Sent on every monitoring tick,
// exactly like the old "apps" WebSocket message.
message ApplicationInfo {
  string id = 1;
  string server_id = 2;
  string name = 3;
  string status = 4;
  string language = 5;
  int32 port = 6;
  string build_status = 7;
  int32 pid = 8;
  string uptime = 9;
  int64 created_at = 10;
  int64 updated_at = 11;

  // Application configuration blocks (process/networking/logging/storage).
  // Populated whenever the CLI knows the values; absent/missing groups mean
  // the CLI has no configuration to report. AppConfig is sent on every
  // monitoring tick alongside the fields above.
  AppProcess process = 20;
  AppNetworking networking = 21;
  AppLogging logging = 22;
  AppStorage storage = 23;
}

// AppProcess describes how the CLI launches and supervises a managed app.
message AppProcess {
  string working_dir = 1;
  string executable = 2;
  string start_command = 3;
  string stop_command = 4;
  int32 max_cpu_percent = 5;
  int64 max_memory_mb = 6;
  int64 max_open_files = 7;
  int64 max_processes = 8;
  bool auto_restart = 9;
  int32 crash_loop_backoff = 10; // seconds
  int32 graceful_shutdown = 11;  // seconds
  int32 max_restart_attempts = 12;
  int32 restart_delay_ms = 13;
}

// AppNetworking describes how a managed app is exposed to the network.
message AppNetworking {
  int32 listen_port = 1;
  string bind_address = 2;
  string public_domain = 3;
  string base_path = 4;
  bool tls_enabled = 5;
  string cert_path = 6;
  string key_path = 7;
  bool proxy_enabled = 8;
  bool cors_enabled = 9;
  repeated string allowed_origins = 10;
  bool rate_limit_enabled = 11;
  int32 rate_limit_rps = 12;
}

// AppLogging describes how a managed app's output is captured and rotated.
message AppLogging {
  bool json_logs = 1;
  bool persistent_logs = 2;
  string log_level = 3;
  string log_file_path = 4;
  string stderr_file_path = 5;
  string log_format = 6;
  bool rotation_enabled = 7;
  int32 rotation_max_size_mb = 8;
  int32 rotation_max_files = 9;
  bool rotation_compress = 10;
}

// AppStorage describes where a managed app stores its data on disk.
message AppStorage {
  repeated string volumes = 1;
  string data_dir = 2;
  string temp_dir = 3;
}

// LogSource distinguishes application logs from the CLI's own daemon logs,
// matching the old "app_logs" vs "self_logs" WebSocket message types.
enum LogSource {
  LOG_SOURCE_UNSPECIFIED = 0;
  LOG_SOURCE_APPLICATION = 1;
  LOG_SOURCE_SELF = 2;
}

// LogStream identifies whether an application log line originated on the
// app's stdout or stderr. Self (daemon) logs always use
// LOG_STREAM_UNSPECIFIED.
enum LogStream {
  LOG_STREAM_UNSPECIFIED = 0;
  LOG_STREAM_STDOUT = 1;
  LOG_STREAM_STDERR = 2;
}

// MonitorLogEntry mirrors logs.LogEntry. Sent on every monitoring tick for
// both application and self logs.
message MonitorLogEntry {
  string id = 1;
  string server_id = 2;
  string app_id = 3;
  string log = 4;
  int64 date = 5;
  string level = 6;
  LogSource source = 7;
  // stream is populated for application logs (stdout/stderr); self logs leave
  // it unspecified.
  LogStream stream = 8;
  // component is populated for self (daemon) logs (e.g. "monitor", "health",
  // "grpc") and empty for application logs.
  string component = 9;
}

// MonitorCommandRequest mirrors the old "command" WebSocket message payload
// (monitor.CommandPayload): a remote-control instruction from the backend,
// e.g. restart/stop/start a specific managed application.
message MonitorCommandRequest {
  string request_id = 1;
  string type = 2;
  string app_name = 3;

  // Optional one-off deployment overrides for a "rebuild" command. Empty /
  // zero means "use the app's persisted phelix.yaml", which is the behavior
  // of every command sent before these fields existed. The agent never
  // writes an override back to phelix.yaml.
  //
  // The agent rejects the command through MonitorCommandResult rather than
  // degrading silently when it cannot honor the override exactly: a strategy
  // it does not implement, replicas on a non-rolling strategy, or either
  // field set on a command other than "rebuild".
  string strategy = 4;  // "classic" | "blue-green" | "rolling"
  int32 replicas = 5;   // rolling only; >= 1
}

// MonitorCommandResult mirrors the old "command_response" WebSocket message
// sent back to the backend after a command finishes executing.
message MonitorCommandResult {
  string request_id = 1;
  string command = 2;
  string app_name = 3;
  string status = 4;
  string error = 5;
  int64 timestamp = 6;
}

// MonitorEvent is a single message sent from the CLI monitor daemon to the
// backend over the long-lived MonitorStream. Exactly one payload is set per
// event, mirroring the "type"/"payload" envelope used by the old WebSocket
// protocol ("servers", "server_metrics", "metrics", "apps", "app_logs",
// "self_logs", "command_response", "pong").
//
// The oneof is intentionally extensible: new monitoring signals can be added
// as additional fields without breaking existing consumers.
message MonitorEvent {
  string server_id = 1;
  int64 timestamp = 2;

  oneof payload {
    ServerInfo server_info = 10;
    ServerMetrics server_metrics = 11;
    AppResourceMetrics app_metrics = 12;
    ApplicationInfo app_info = 13;
    MonitorLogEntry log_entry = 14;
    MonitorCommandResult command_result = 15;
    Pong pong = 16;
    // deployment_snapshot resyncs the current deployment topology of one app.
    // The monitor daemon pushes it periodically and after every reconnect, so
    // a backend that missed the deployment's events (or restarted) still
    // converges on the real state. Optional: an older backend simply sees an
    // unknown oneof case and ignores it.
    DeploymentSnapshot deployment_snapshot = 17;
  }
}

// MonitorControl is a single message sent from the backend to the CLI
// monitor daemon over the same long-lived MonitorStream. It mirrors the old
// "command" and "ping" WebSocket message types sent by the backend.
message MonitorControl {
  oneof payload {
    MonitorCommandRequest command = 1;
    Ping ping = 2;
  }
}

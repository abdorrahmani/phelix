syntax = "proto3";

package phelix;

option go_package = "github.com/abdorrahmani/phelix/internal/grpc/proto";

// CLIMetadata represents continuous metadata about the CLI installation.
message CLIMetadata {
  string server_id = 1;
  string user_id = 2;
  string session_token = 3;
  string cli_version = 4;
  string build_version = 5;
  string git_commit = 6;
  string build_time = 7;
  int64 uptime_seconds = 8;
  string current_state = 9;
  string monitor_status = 10;
  int32 total_managed_apps = 11;
  int32 running_apps = 12;
  int64 timestamp = 13;
  // ConnectionState is the agent's backend connection/auth state
  // (connected / disconnected / auth_expired), separate from the local
  // runtime status (current_state/monitor_status). Absent in older agents —
  // the backend must treat an empty value as "unknown" and keep working.
  string connection_state = 14;

  // Capabilities the sending agent's build actually supports — its own
  // declaration, not a version comparison (source builds carry no reliable
  // version). Each implemented feature registers its own entry, so the list
  // grows as the agent build gains features.
  //
  // Known values:
  //   "monitoring"         — MonitorStream: metrics, logs, ServerInfo and the
  //                          lifecycle command channel (start/stop/restart/
  //                          remove/rebuild).
  //   "deployment"         — zero-downtime deployment (blue-green/rolling/
  //                          canary/progressive) with strategy overrides and
  //                          deployment telemetry/snapshots.
  //   "rollback"           — the "rollback" command and its durable
  //                          idempotency ledger.
  //   "build_matrix"       — matrix_* commands, matrix events, run-state
  //                          resync.
  //   "webhook_management" — webhook_* commands over the existing webhook
  //                          subsystem (jobs, deliveries, configuration).
  //
  // The list is sorted and duplicate-free. Absent/empty in older agents —
  // the backend must gate feature-specific commands on the specific entry,
  // never on the field's presence, and keep working. An unknown entry is a
  // capability this backend does not consume yet (forward compatibility),
  // never an error.
  repeated string capabilities = 15;
}

// MetadataResponse is the backend's response to metadata sync.
message MetadataResponse {
  bool accepted = 1;
  string message = 2;
}

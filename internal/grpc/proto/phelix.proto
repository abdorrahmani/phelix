syntax = "proto3";

package phelix;

option go_package = "github.com/abdorrahmani/phelix/internal/grpc/proto";

import "internal/grpc/proto/events.proto";
import "internal/grpc/proto/rollback.proto";
import "internal/grpc/proto/metadata.proto";
import "internal/grpc/proto/envelope.proto";
import "internal/grpc/proto/health.proto";
import "internal/grpc/proto/monitoring.proto";
import "internal/grpc/proto/deployment.proto";

// PhelixService is the main service for CLI-to-backend communication.
service PhelixService {
  // ReportEvent sends an application lifecycle event to the backend.
  rpc ReportEvent(ApplicationEvent) returns (EventResponse);

  // SyncMetadata streams CLI metadata to the backend (unary, called periodically).
  rpc SyncMetadata(CLIMetadata) returns (MetadataResponse);

  // StreamEvents opens a bidirectional stream for continuous event reporting.
  rpc StreamEvents(stream ApplicationEvent) returns (stream EventAck);

  // AgentStream is the bidirectional stream for backend-to-CLI commands.
  // The backend sends health commands, remote executions, and other requests.
  // The CLI processes them locally and returns results through the same stream.
  // This works through NAT/firewalls because the CLI initiates the connection.
  rpc AgentStream(stream ClientToServer) returns (stream ServerToClient);

  // HealthSetConfig initializes health checks for an application (CLI-initiated).
  //
  // DEPRECATED: the agent no longer calls this. Health configuration reaches the
  // backend through AppHealthSnapshot on MonitorStream, which survives a
  // disconnect and propagates deletes. Kept declared so existing backends keep
  // compiling; remove the handler in Phase 2.
  rpc HealthSetConfig(HealthSetConfigRequest) returns (HealthConfigResponse) {
    option deprecated = true;
  }

  // HealthAddEndpoint adds a health check endpoint (CLI-initiated).
  // DEPRECATED — see HealthSetConfig.
  rpc HealthAddEndpoint(HealthAddEndpointRequest) returns (HealthConfigResponse) {
    option deprecated = true;
  }

  // HealthRemoveEndpoint removes a health check endpoint (CLI-initiated).
  // DEPRECATED — see HealthSetConfig.
  rpc HealthRemoveEndpoint(HealthRemoveEndpointRequest) returns (HealthConfigResponse) {
    option deprecated = true;
  }

  // ReportHealthResult sends a health check result from the daemon to the backend.
  //
  // DEPRECATED: one unary RPC per endpoint per interval, with no stable endpoint
  // identity and no ordering against configuration. Superseded by
  // AppHealthSnapshot on MonitorStream. The agent no longer calls this.
  rpc ReportHealthResult(ReportHealthResultRequest) returns (ReportHealthResultResponse) {
    option deprecated = true;
  }

  // ReportAutoRestart sends an auto-restart event from the daemon to the backend.
  // Still in use: an auto-restart is a point-in-time event that cannot be
  // re-derived from a later snapshot.
  rpc ReportAutoRestart(ReportAutoRestartRequest) returns (ReportAutoRestartResponse);

  // ReportRollbackEvent sends a detailed rollback lifecycle event to the backend.
  // Each step of a rollback (init, lock, stop, copy, start, promote, etc.)
  // emits its own event so the backend can reconstruct the full timeline.
  rpc ReportRollbackEvent(RollbackLifecycleEvent) returns (EventResponse);

  // ReportDeploymentEvent sends one deployment lifecycle transition
  // (classic / blue-green / rolling) to the backend. Every event carries the
  // full DeploymentSnapshot, so a backend that missed earlier events can still
  // reconstruct the current topology from any single event.
  //
  // Backward compatibility: a backend that does not implement this RPC answers
  // UNIMPLEMENTED. The CLI treats that as "telemetry not consumed yet" and
  // continues the deployment unchanged.
  rpc ReportDeploymentEvent(DeploymentEvent) returns (EventResponse);

  // MonitorStream is the persistent, bidirectional monitoring channel that
  // replaces the legacy WebSocket monitor. The CLI monitor daemon opens this
  // stream once and keeps it open for the lifetime of the process, pushing a
  // continuous flow of MonitorEvent messages (server info, server metrics,
  // per-app resource usage, per-app details, logs) roughly every 2 seconds.
  // The backend may push MonitorControl messages back at any time (remote
  // commands, keepalive pings). The CLI never opens a new connection per
  // metric update — only a new stream after a disconnect/reconnect.
  rpc MonitorStream(stream MonitorEvent) returns (stream MonitorControl);

  // AgentLogout explicitly marks the agent as disconnected on the backend
  // before the local session is deleted. It does NOT delete the agent/server
  // record — the backend upserts connection_state = "disconnected" keyed by
  // the persistent agent_id and preserves last_seen_at. Idempotent: repeated
  // calls return OK.
  rpc AgentLogout(AgentLogoutRequest) returns (MetadataResponse);
}

// AgentLogoutRequest identifies the agent logging out. agent_id is the
// persistent Phelix runtime identity, so the backend updates the existing
// record instead of creating a new one.
message AgentLogoutRequest {
  string agent_id = 1;
  string reason = 2; // "logout" or "auth_expired"
}

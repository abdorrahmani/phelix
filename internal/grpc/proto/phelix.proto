syntax = "proto3";

package phelix;

option go_package = "github.com/abdorrahmani/phelix/internal/grpc/proto";

import "internal/grpc/proto/events.proto";
import "internal/grpc/proto/metadata.proto";
import "internal/grpc/proto/envelope.proto";

// PhelixService is the main service for CLI-to-backend communication.
service PhelixService {
  // ReportEvent sends an application lifecycle event to the backend.
  rpc ReportEvent(ApplicationEvent) returns (EventResponse);

  // SyncMetadata streams CLI metadata to the backend (unary, called periodically).
  rpc SyncMetadata(CLIMetadata) returns (MetadataResponse);

  // StreamEvents opens a bidirectional stream for continuous event reporting.
  rpc StreamEvents(stream ApplicationEvent) returns (stream EventAck);

  // AgentStream is the bidirectional stream for backend-to-CLI commands.
  // The backend sends health commands, remote executions, and other requests.
  // The CLI processes them locally and returns results through the same stream.
  // This works through NAT/firewalls because the CLI initiates the connection.
  rpc AgentStream(stream ClientToServer) returns (stream ServerToClient);
}

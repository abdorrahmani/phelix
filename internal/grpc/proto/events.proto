syntax = "proto3";

package phelix;

option go_package = "github.com/abdorrahmani/phelix/internal/grpc/proto";

// ApplicationEvent represents a single application lifecycle event.
message ApplicationEvent {
  string server_id = 1;
  string user_id = 2;
  string session_token = 3;
  string app_id = 4;
  string app_name = 5;
  string action = 6;
  int64 timestamp = 7;
  bool success = 8;
  string error_message = 9;
  int32 pid = 10;
  string deployment_mode = 11;
  string version = 12;
}

// EventResponse is the backend's response to a reported event.
message EventResponse {
  bool accepted = 1;
  string message = 2;
}

// EventAck is a lightweight acknowledgement for streamed events.
message EventAck {
  bool received = 1;
  string event_id = 2;
}

// RollbackLifecycleEvent reports a single step in the rollback execution
// lifecycle. The backend receives a stream of these events to reconstruct
// the full rollback timeline, display real-time progress, generate an audit
// trail, and diagnose failures.
message RollbackLifecycleEvent {
  // Identity
  string server_id = 1;
  string cli_app_id = 2;
  string resolved_app_id = 3;
  string app_name = 4;

  // Rollback configuration
  string deployment_mode = 5;
  string rollback_strategy = 6;

  // Versioning
  string current_version = 7;
  string target_version = 8;
  string target_tag = 9;

  // Execution state
  string current_step = 10;
  bool success = 11;
  string message = 12;
  string error = 13;

  // Timestamps and timing
  int64 timestamp = 14;
  int64 duration_ms = 15;

  // Process context
  string hostname = 16;
  int32 pid = 17;

  // Version list (populated on --list events)
  repeated RollbackVersionEntry versions = 18;

  // Arbitrary key-value metadata for future extensibility.
  map<string, string> metadata = 19;

  // Auth identity (also sent as gRPC headers, but included in the message
  // body so the backend can attribute the event without parsing headers).
  string user_id = 20;
  string session_token = 21;
}

// RollbackVersionEntry describes one retained version in the --list output.
message RollbackVersionEntry {
  int32 version = 1;
  string tag = 2;
  string git_commit = 3;
  int64 build_timestamp = 4;
  int64 binary_size = 5;
  bool current = 6;
  bool prune_soon = 7;
}

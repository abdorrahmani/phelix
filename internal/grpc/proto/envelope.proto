syntax = "proto3";

package phelix;

option go_package = "github.com/abdorrahmani/phelix/internal/grpc/proto";

import "internal/grpc/proto/health.proto";
import "internal/grpc/proto/ping.proto";

// ServerToClient is the envelope for messages from backend to CLI.
message ServerToClient {
  oneof payload {
    HealthCommand health_command = 1;
    CancelRequest cancel = 2;
    Ping ping = 3;
  }
}

// ClientToServer is the envelope for messages from CLI to backend.
message ClientToServer {
  oneof payload {
    HealthResult health_result = 1;
    HealthStatusUpdate health_update = 2;
    Pong pong = 3;
  }
}
